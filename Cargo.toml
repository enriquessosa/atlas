[package]
name = "atlas"
version = "0.1.0"
edition = "2024"
description = "A local-first, read-only architecture explorer for Rust repositories"
license = "MIT"
rust-version = "1.88"
readme = "README.md"

[dependencies]
clap = { version = "=4.6.7", features = ["derive"] }
proc-macro2 = { version = "=1.0.107", features = ["span-locations"] }
syn = { version = "=2.0.119", features = ["full", "parsing"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
thiserror = "=2.0.21"
